[alembic]
script_location = app/db/migrations
prepend_sys_path = .
# El nombre del fichero es el propio identificador de la revisión, que en este
# repositorio se pasa siempre a mano con `--rev-id NNNN_slug` (ver CLAUDE.md,
# sección "Migraciones"). Así el fichero se llama igual que la revisión y el
# orden alfabético de la carpeta coincide con el orden real de las migraciones.
# Antes había aquí una plantilla con fecha y hora que generaba nombres tipo
# `20260812_0939_slug.py`: contradecía la convención y las cuatro primeras
# migraciones todavía arrastran ese nombre.
file_template = %%(rev)s
timezone = UTC

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
