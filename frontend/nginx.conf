# CSP del panel, definida UNA vez y reutilizada en cada bloque que la necesita.
#
# Va en un `map` (contexto http — este fichero se incluye desde conf.d, que ya
# está dentro de http) porque `add_header` NO se hereda: en cuanto un `location`
# declara su propio add_header, PIERDE todos los del servidor. Sin la variable
# habría que repetir la cadena entera en cada bloque y acabarían divergiendo.
#
# Qué permite y por qué:
#
#   media-src — la grabación de cada llamada se reproduce desde el dominio de
#   Retell (un <audio src> externo). Sin declararlo hereda default-src 'self' y
#   el navegador BLOQUEA el audio: el reproductor sale pero no suena. Se permite
#   https: (el enlace de Retell puede venir de varios CDNs suyos y, con
#   grabaciones firmadas, el host cambia) más data:/blob: para audio local.
#
#   connect-src — a dónde habla el panel DE VERDAD, repasado sobre el código:
#     1. su propio origen ('self'): /config.js, /sw.js y los assets;
#     2. la API del backend, por https Y por wss — el WebSocket del inbox sale
#        del MISMO host (services/api.ts: apiBaseWs = apiBaseHttp con ws://);
#     3. nada más. Las grabaciones de Retell son un <audio src>, o sea media-src
#        y no connect-src; y la URL del servidor MCP solo se PINTA en el panel de
#        tokens para copiarla a mano, el navegador nunca la llama.
#
#   Por qué `https:` y `wss:` siguen abiertos: el host del backend NO se conoce
#   aquí. Se decide en el ARRANQUE del contenedor (API_BASE_URL → /config.js,
#   ver docker-entrypoint.d/40-app-config.sh) y cada instalación tiene el suyo,
#   así que un fichero estático horneado en la imagen no puede nombrarlo.
#   Apretarlo a un dominio concreto dejaría la app muerta en cualquier
#   despliegue que no fuera ese, y no se vería hasta producción. Con
#   script-src 'self' (sin 'unsafe-inline' ni 'unsafe-eval') el hueco que queda
#   exige antes un XSS, que es justo lo que esa directiva corta.
#
#   Para cerrarlo del todo en una instalación concreta, SIN rebuild: monta un
#   fichero en /etc/nginx/csp.d/ con una SEGUNDA cabecera CSP. El navegador
#   aplica todas las políticas que recibe y se queda con la intersección, así
#   que basta con declarar ahí lo que quieras estrechar:
#     add_header Content-Security-Policy "connect-src 'self' https://api.tudominio.com wss://api.tudominio.com" always;
#   El include de abajo lleva comodín: si el directorio no existe, nginx arranca
#   igual. (Comprobado con `nginx -t` en nginx:1.27-alpine, con y sin la carpeta.)
#
#   Los restos de desarrollo `http://localhost:*` / `ws://localhost:*` sí se han
#   acotado: eran un comodín a CUALQUIER puerto del ordenador de quien abre el
#   panel. Se deja solo el puerto del backend de la pila local de
#   docker-compose (8000 — ver docker-compose.yml, VITE_API_BASE_URL por
#   defecto http://localhost:8000), que es lo único que los necesitaba.
map $host $csp_policy {
  default "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; object-src 'none'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https: wss: http://localhost:8000 ws://localhost:8000 http://127.0.0.1:8000 ws://127.0.0.1:8000;";
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 25M;

  # Oculta versión de nginx
  server_tokens off;

  # Cabeceras de seguridad globales.
  #
  # OJO al tocar esto: `add_header` NO es acumulativo entre niveles. Un
  # `location` que declara UN add_header propio se queda SIN estas cinco. Por
  # eso cada bloque de abajo que fija su Cache-Control las repite. Hasta ahora
  # no lo hacía y el resultado era que el documento HTML del panel — el único
  # sitio donde la CSP hace algo — se servía SIN ninguna cabecera de seguridad:
  # `/` cae por try_files en `location = /index.html`, que solo tenía su
  # Cache-Control. Ni CSP, ni X-Frame-Options, ni HSTS.
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Content-Security-Policy $csp_policy always;

  # Punto de extensión para endurecer la CSP por despliegue (ver la cabecera del
  # fichero). Vacío por defecto: el comodín hace que un directorio inexistente
  # no sea un error de arranque. Se repite en cada location por la misma regla
  # de no-herencia de add_header; si solo estuviera aquí, la política extra NO
  # llegaría al documento HTML.
  include /etc/nginx/csp.d/*.conf;

  # El service worker NO debe cachearse de forma agresiva: el navegador lo
  # re-comprueba en cada visita para coger la versión nueva. Service-Worker-Allowed
  # permite el scope raíz. (Coincidencia exacta → tiene prioridad sobre el regex.)
  location = /sw.js {
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy $csp_policy always;
    include /etc/nginx/csp.d/*.conf;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Service-Worker-Allowed "/";
    try_files $uri =404;
  }

  # config.js se genera en RUNTIME (URL del backend). NUNCA cachearlo, o tras un
  # cambio de despliegue se quedaría pegada la URL antigua. (Coincidencia exacta
  # → tiene prioridad sobre el regex de assets de abajo.)
  location = /config.js {
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy $csp_policy always;
    include /etc/nginx/csp.d/*.conf;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri =404;
  }

  # Cache assets agresivo. Repite las cabeceras de seguridad por lo dicho arriba
  # (aquí la que importa de verdad es nosniff, sobre respuestas js/css).
  location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|gif|webp|ico)$ {
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy $csp_policy always;
    include /etc/nginx/csp.d/*.conf;
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # No cachear el HTML para que el SPA siempre coja el bundle correcto.
  # Este es EL documento: sin repetir aquí las cabeceras, la CSP no se aplicaba
  # a nada (ver la nota del bloque global).
  location = /index.html {
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy $csp_policy always;
    include /etc/nginx/csp.d/*.conf;
    add_header Cache-Control "no-store, no-cache, must-revalidate";
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }
}
